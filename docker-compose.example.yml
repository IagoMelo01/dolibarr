services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
        PHP_VERSION: "8.2"
        CACHE_BUSTER: "v1-$(date +%s)" # qualquer string; só pra cache-bust
    container_name: dolibarr-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8008:80"
    environment:
      PHP_MEMORY_LIMIT: "512M"
      PHP_MAX_INPUT_VARS: "5000"
    volumes:
      - ./:/var/www/html # seu fork (com htdocs/)
      - /root/dolifevo/documents:/var/www/html/documents # persistência
    init: true
    mem_limit: 768m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost/index.php >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 10

  db:
    image: mariadb:10.6
    container_name: dolibarr-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolipass
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=30
      - --performance-schema=OFF
      - --table-open-cache=200
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    mem_limit: 384m
    volumes:
      - db_data:/var/lib/mysql
      - ./my.cnf:/root/dolifevo/my.cnf:ro
    init: true
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 20s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: dolibarr-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8009:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    init: true
    mem_limit: 256m

volumes:
  db_data:
