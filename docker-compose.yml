version: "3.9"

services:
  app:
    image: ghcr.io/dolibarr/dolibarr:php8.2-apache  # imagem com PHP+Apache e extensões
    container_name: dolibarr-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8008:80"
    environment:
      # Ajustes PHP comuns (opcionais)
      PHP_MEMORY_LIMIT: "512M"
      PHP_MAX_INPUT_VARS: "5000"
    volumes:
      # monta seu código dentro do container (usa seu Dolibarr customizado)
      - ./dolibarr:/var/www/html
      # documentos persistentes
      - ./documents:/var/www/html/documents
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/index.php >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

  db:
    image: mariadb:10.6
    container_name: dolibarr-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolipass
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 20s
      timeout: 5s
      retries: 10

volumes:
  db_data:
