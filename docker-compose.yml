services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: 1000
        APP_GID: 1000
        PHP_VERSION: "8.2"   # altere p/ 8.1 ou 8.0 se seu fork exigir
    container_name: dolibarr-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      PHP_MEMORY_LIMIT: "512M"
      PHP_MAX_INPUT_VARS: "5000"
    volumes:
      - ./dolibarr:/var/www/html              # seu fork (com htdocs/)
      - /root/dolifevo/documents:/var/www/html/documents   # persistência
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/index.php >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

  db:
    image: mariadb:10.6
    container_name: dolibarr-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolipass
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 20s
      timeout: 5s
      retries: 10

volumes:
  db_data:
